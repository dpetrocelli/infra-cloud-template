# Class 4 (BC): pipeline of smart contracts. `forge test` runs on every PR;
# deploy to a testnet (Base Sepolia, class 7) only happens on a tagged
# release, and only if a deploy key is configured as a repo secret -- this
# workflow never invents or hardcodes one.
name: contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**"]
  pull_request:
    paths: ["contracts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge test
        run: forge test -vv

  deploy-testnet:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    environment: testnet # manual approval + where the deploy key secret lives
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy to Base Sepolia
        env:
          # Set as a repository/environment SECRET, never committed.
          DEPLOYER_PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_DEPLOYER_KEY }}
          RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL }}
        run: |
          forge script script/Deploy.s.sol \
            --rpc-url "$RPC_URL" \
            --private-key "$DEPLOYER_PRIVATE_KEY" \
            --broadcast

      - name: Version ABI + bytecode artifacts
        run: |
          mkdir -p ../artifacts/contracts
          cp out/Counter.sol/Counter.json ../artifacts/contracts/Counter-${{ github.ref_name }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.ref_name }}
          path: artifacts/contracts/
