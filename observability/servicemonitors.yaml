# Class 6: one ServiceMonitor per class Service, all labeled so
# kube-prometheus-stack's Prometheus picks them up (see
# kube-prometheus-stack-values.yaml). Apply with:
#   kubectl apply -f observability/servicemonitors.yaml
#
# Adjust `release:` labels/selectors to match your Helm release name if you
# changed it from the chart defaults.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: servicio-patron
  labels:
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: servicio-patron
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pow
  labels:
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: pow
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: model
  labels:
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: model
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# Anvil does not expose Prometheus metrics natively: it speaks JSON-RPC.
# The sidecar below is a tiny script that polls eth_blockNumber and turns it
# into a Prometheus gauge, kept as simple as possible on purpose.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: anvil-exporter
  labels:
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: anvil-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
