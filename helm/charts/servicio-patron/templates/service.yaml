apiVersion: v1
kind: Service
metadata:
  name: {{ include "servicio-patron.fullname" . }}
  labels:
    app: {{ include "servicio-patron.fullname" . }}
spec:
  selector:
    app: {{ include "servicio-patron.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
