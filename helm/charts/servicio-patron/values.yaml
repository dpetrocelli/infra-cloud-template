# Default values for the servicio patron chart, written for GKE.
#   GKE:          helm upgrade --install servicio-patron helm/charts/servicio-patron \
#                   --set image.repository=$AR/app --set image.tag=<sha or vX.Y.Z>
#   k3s / k3d:    helm upgrade --install servicio-patron helm/charts/servicio-patron \
#                   -f helm/charts/servicio-patron/values-k3s.yaml
# Install it with the release name "servicio-patron" so the names in the docs match.
image:
  # Artifact Registry path: <REGION>-docker.pkg.dev/<PROJECT_ID>/infra-cloud-template/app
  repository: app
  # Never a moving tag such as "latest": a tag pushed by CI (git sha or vX.Y.Z).
  tag: v1
  pullPolicy: IfNotPresent

# Only used when autoscaling.enabled=false (with the HPA on, the HPA decides).
replicaCount: 1

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

persistence:
  size: 1Gi
  # "" = do not set the field: the cluster uses its DEFAULT StorageClass
  # (GKE: standard-rwo, k3s: local-path). This field cannot be changed after
  # the first install: to change it, helm uninstall + kubectl delete pvc.
  storageClassName: ""

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
