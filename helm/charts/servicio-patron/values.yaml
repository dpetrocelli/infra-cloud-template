# Default values for the servicio patron chart. Override per-environment
# with `helm upgrade -f envs/dev.values.yaml` or --set.
image:
  repository: servicio-patron
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

persistence:
  size: 1Gi
  storageClassName: standard

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
