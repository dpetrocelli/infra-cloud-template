# Same lesson as the class-1 VM demo, on Kubernetes: the pod is disposable,
# /state/anvil-state.json on the PVC is the source of truth.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anvil.fullname" . }}
  labels:
    app: {{ include "anvil.fullname" . }}
spec:
  serviceName: {{ include "anvil.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "anvil.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "anvil.fullname" . }}
    spec:
      containers:
        - name: anvil
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["anvil"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--state"
            - "/state/anvil-state.json"
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: state
              mountPath: /state
        {{- if .Values.exporter.enabled }}
        - name: anvil-exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          env:
            - name: RPC_URL
              value: "http://localhost:{{ .Values.service.port }}"
            - name: PORT
              value: "{{ .Values.exporter.port }}"
          ports:
            - containerPort: {{ .Values.exporter.port }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
