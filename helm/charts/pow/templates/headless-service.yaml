# Headless service (clusterIP: None): gives each pod a stable DNS name
# <pod-name>.<service-name>.<namespace>.svc.cluster.local, which is how the
# nodes find each other for /peers/sync (class 8: several PoW nodes,
# longest-valid-chain rule).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pow.fullname" . }}-headless
  labels:
    # Different from the regular Service on purpose (no app.kubernetes.io/name):
    # otherwise the pow ServiceMonitor would scrape every pod twice.
    app: {{ include "pow.fullname" . }}-headless
spec:
  clusterIP: None
  selector:
    app: {{ include "pow.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
