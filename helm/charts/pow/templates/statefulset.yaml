apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pow.fullname" . }}
  labels:
    app: {{ include "pow.fullname" . }}
spec:
  serviceName: {{ include "pow.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "pow.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "pow.fullname" . }}
    spec:
      containers:
        - name: pow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: DIFFICULTY
              value: "{{ .Values.difficulty }}"
            # Every peer's stable DNS name via the headless service. Includes
            # self, which is harmless: /peers/sync just compares its own
            # chain against itself as one of the candidates.
            - name: PEERS
              value: {{ range $i := until (int .Values.replicaCount) }}http://{{ include "pow.fullname" $ }}-{{ $i }}.{{ include "pow.fullname" $ }}-headless:{{ $.Values.service.port }},{{ end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
