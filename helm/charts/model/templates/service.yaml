apiVersion: v1
kind: Service
metadata:
  name: {{ include "model.fullname" . }}
  labels:
    app: {{ include "model.fullname" . }}
    # Fixed label (does not depend on the release name): the ServiceMonitors
    # in observability/servicemonitors.yaml select on it.
    app.kubernetes.io/name: model
spec:
  selector:
    app: {{ include "model.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
